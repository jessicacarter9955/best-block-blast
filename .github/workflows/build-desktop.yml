name: Build Block Rush Desktop (Windows + Linux)

# Desktop binaries are separate from Steam publishing. Manual runs work for
# review branches; successful default-branch pushes refresh downloadable CI
# artifacts. No Steamworks credentials or paid storefront are required.
on:
  workflow_dispatch:
  push:
    branches: [master, main, codex/blockrush-six-resolution-artwork]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'artwork/resolution-pack/backgrounds/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows standalone ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Windows desktop runner
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.jessicacarter --project-name chocoblock .
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi
          flutter pub get
      - name: Run tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release --no-tree-shake-icons
      - name: Package Windows portable app
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "artifacts/blockrush-windows-$shortSha.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: blockrush-windows-${{ github.sha }}
          path: artifacts/*.zip
          retention-days: 90
          if-no-files-found: error

  linux:
    name: Linux standalone TAR.GZ
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Linux desktop runner
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --org com.jessicacarter --project-name chocoblock .
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi
          flutter pub get
      - name: Run tests
        run: flutter test
      - name: Build Linux release
        run: flutter build linux --release --no-tree-shake-icons
      - name: Package Linux portable app
        run: |
          mkdir -p artifacts
          tar -C build/linux/x64/release/bundle -czf "artifacts/blockrush-linux-${GITHUB_SHA::7}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: blockrush-linux-${{ github.sha }}
          path: artifacts/*.tar.gz
          retention-days: 90
          if-no-files-found: error
