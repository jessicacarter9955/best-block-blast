name: Verify Android AAB pipeline (ephemeral CI key)

# Free smoke test for Gradle release signing and AAB packaging. The generated
# key is intentionally destroyed with the runner; this is NOT a Play upload
# artifact, cannot be used for future updates and MUST NOT be distributed.
on:
  workflow_dispatch:
  push:
    branches: [codex/blockrush-six-resolution-artwork]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'artwork/resolution-pack/backgrounds/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'setup/android/**'
      - 'setup/apply-android-overrides.sh'
      - '.github/workflows/build-aab-smoke.yml'

permissions:
  contents: read

jobs:
  smoke-aab:
    name: Compile & verify AAB without publishing (temporary key)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner and Flutter dependencies
        run: |
          flutter create --platforms=android --org com.jessicacarter --project-name chocoblock .
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi
          flutter pub get
      - name: Run original gameplay and packaged-artwork tests
        run: flutter test
      - name: Create temporary key and compile signed AAB — no export
        run: |
          set -euo pipefail
          keystore_file="$RUNNER_TEMP/blockrush-ci-ephemeral.jks"
          trap 'rm -f "$keystore_file"' EXIT
          password=$(openssl rand -hex 24)
          export ANDROID_KEYSTORE_FILE="$keystore_file"
          export ANDROID_KEYSTORE_PASSWORD="$password"
          export ANDROID_KEY_ALIAS='ephemeralCiUpload'
          export ANDROID_KEY_PASSWORD="$password"
          keytool -genkeypair -noprompt -keystore "$keystore_file" \
            -storepass "$password" -keypass "$password" \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 \
            -validity 1 -dname 'CN=BlockRush Temporary CI Signing, OU=Test, O=No Distribution, C=US'
          bash setup/apply-android-overrides.sh
          flutter build appbundle --release --no-tree-shake-icons
          bundle_file=build/app/outputs/bundle/release/app-release.aab
          test -s "$bundle_file"
          jarsigner -verify "$bundle_file" >/dev/null
          echo '✅ Android App Bundle compiled and JAR signature verified using an ephemeral CI key.' >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ This AAB is NOT Play Store distributable; its upload key is discarded, and no AAB artifact is uploaded.' >> "$GITHUB_STEP_SUMMARY"
