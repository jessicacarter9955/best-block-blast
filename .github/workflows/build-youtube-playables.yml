name: Build YouTube Playables

on:
  push:
    branches: [codex/youtube-playables]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build standalone Playables web bundle
        run: |
          flutter build web --release --no-tree-shake-icons --base-href / --dart-define=YOUTUBE_PLAYABLES_BUILD=true
          python3 tool/prepare_youtube_playables.py
      - name: Check bundle limits and package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          root = Path("build/web")
          files = [p for p in root.rglob("*") if p.is_file()]
          if len(files) > 8000:
              raise SystemExit(f"Too many files for Playables: {len(files)}")
          invalid = [p.relative_to(root).as_posix() for p in files
                     if not re.fullmatch(r"[A-Za-z0-9_./-]+", p.relative_to(root).as_posix())]
          if invalid:
              raise SystemExit(f"Unsupported bundle file names: {invalid[:10]}")
          output = Path("artifacts/lumen-loom-youtube-playables.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.relative_to(root).as_posix())
          size = output.stat().st_size
          limit = 30 * 1024 * 1024
          print(f"Bundle: {size:,} bytes; {len(files)} files")
          if size >= limit:
              raise SystemExit(f"Initial bundle must be below 30 MiB; got {size:,} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-loom-youtube-playables
          path: artifacts/lumen-loom-youtube-playables.zip
          if-no-files-found: error
          retention-days: 90
