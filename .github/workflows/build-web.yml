name: Build Web Bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Flutter Web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Test puzzle routes
        run: flutter test

      - name: Build web bundle
        run: |
          flutter build web --release --base-href /
          cd build/web
          zip -r ../lumen-loom-web.zip .
          cd ../..

      - name: Rename bundle with commit/tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          mkdir -p artifacts
          mv build/lumen-loom-web.zip "artifacts/lumen-loom-web-${VERSION}.zip"
          echo "ZIP_PATH=artifacts/lumen-loom-web-${VERSION}.zip" >> $GITHUB_ENV
          echo "ZIP_NAME=lumen-loom-web-${VERSION}.zip" >> $GITHUB_ENV

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: artifacts/*.zip
          retention-days: 90
          if-no-files-found: error

      - name: Also copy as lumen-loom-web-latest.zip
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          cp "artifacts/${ZIP_NAME}" artifacts/lumen-loom-web-latest.zip

      - name: Publish bundle to the 'latest' Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
