name: Build Release APK

# Builds the Lumen Loom Flutter app for Android.
# EVERY push (any branch) builds a RELEASE APK and uploads it as a GitHub
# Actions artifact (downloadable from the Actions tab). Tag pushes (v*)
# also attach the APK to a GitHub Release.

on:
  push:
  workflow_dispatch:

# permessi per pubblicare la Release "latest" con l'APK
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Bootstrap Flutter project files
        # `flutter create` generates the full android/ scaffold (with the
        # correct Gradle wrapper for this Flutter version) using our
        # --org and --project-name for the application ID.
        run: |
          flutter create --platforms=android --org com.jessicacarter --project-name lumen_loom .
          # Bootstrap also generates the sample counter-app test. It targets
          # MyApp, which this Flame game does not use. Preserve any tracked test.
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Apply custom Android overrides
        # Overlays the Lumen Loom label, responsive orientation,
        # vector launcher icon, dark theme styles,
        # proguard rules, and patches build.gradle.kts for minSdk=21 +
        # release signing with debug key.
        run: bash setup/apply-android-overrides.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Test puzzle routes
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK with commit/tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/lumen-loom-release-${VERSION}.apk"
          echo "APK_PATH=artifacts/lumen-loom-release-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=lumen-loom-release-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: artifacts/*.apk
          retention-days: 90
          if-no-files-found: error

      # Release "latest" SEMPRE aggiornata: APK scaricabile con un click da
      # ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest
      # (niente Actions tab, niente artifact scaduto o zip da spacchettare).
      - name: Also copy as lumen-loom-latest.apk
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          cp "artifacts/${APK_NAME}" artifacts/lumen-loom-latest.apk

      - name: Publish APK to the 'latest' Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lumen Loom — latest APK
          body: |
            Latest test APK from the default branch.

            **Download:** `lumen-loom-latest.apk` below.
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APK to GitHub Release (on tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
