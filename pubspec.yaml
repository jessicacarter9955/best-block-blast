name: chocoblock
description: Native Flutter port of Block Blast — 1:1 with the original
  Construct 3 game (original sprites, geometry, scoring, tutorial and flows).
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: 1.20.0
  flame_audio: ^2.10.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/score/
    - assets/audio/cheerful/
    - assets/sprites-named/
    # manifest.json is in the same folder, listed above
    - assets/data/ranking.json
