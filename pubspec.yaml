name: chocoblock
description: Block Blast puzzle game (chocolate-recolor) wrapped in a Flutter WebView for Android.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game/
    - assets/game/scripts/
    - assets/game/images/
    - assets/game/icons/
    - assets/game/fonts/
    - assets/game/media/
    - assets/game/media/score/
    - assets/game/media/cheerful/
